<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 선택</title>
<link rel="stylesheet" href="app.css">
<style>
  .pv { display: flex; gap: 16px; padding: 14px var(--margin) 16px; }
  .pv > .ph { width: 116px; height: 116px; }
  .pv .side { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pv .nm { font: var(--t-title2); color: #F4F1EA; }
  .pv .pk { font: var(--t-foot); color: #FF9F0A; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .pv .segctl { margin-top: 12px; }
  .pv .acts { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .mini { display: flex; align-items: center; gap: 8px; padding: 0 var(--margin) 14px; font: var(--t-cap); color: #8A867F; }
  .mini .pill { width: 120px; height: 30px; border-radius: 15px; background: #000; border: 0.5px solid #3A3A3A; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 5px; }
  .mini .pill .ph { width: 22px; height: 22px; }
  .mini .pill b { font: 600 12px/14px var(--font); color: #FF9F0A; }
  .price { font: var(--t-sub-strong); color: var(--accent-text); }
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <div class="time num">9:41</div>
    <div class="island compact"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="v">42%</span></div>
    <div class="sys"><i data-icon="signal" data-size="18"></i><i data-icon="wifi" data-size="18"></i><i data-icon="battery" data-size="26" data-w="1.4"></i></div>
  </div>

  <div class="scroll">
    <div class="nav"><h1>캐릭터</h1></div>

    <!-- 미리보기 무대: 지금은 잠긴 강아지를 미리보는 상태 -->
    <section class="stage" aria-label="미리보기">
      <div class="pv">
        <div class="ph" role="img" aria-label="강아지 미리보기, 빠름"><div class="glyph"><i></i></div><div class="tag">강아지 · 80pt 자리</div></div>
        <div class="side">
          <div class="nm">강아지</div>
          <div class="pk"><span class="eq"><i style="height:5px"></i><i style="height:9px"></i><i style="height:6px"></i></span>미리보기 · 동물 팩</div>
          <div class="segctl" role="radiogroup" aria-label="미리보기 속도">
            <span role="radio" aria-checked="false">쉼</span><span role="radio" aria-checked="false">보통</span><span class="on" role="radio" aria-checked="true">빠름</span>
          </div>
          <div class="acts">
            <button class="btn primary sm">동물 팩 보기</button>
          </div>
        </div>
      </div>
      <div class="mini" aria-hidden="true"><span>아일랜드에서는</span><span class="pill"><span class="ph sm"><span class="glyph"><i></i></span></span><b class="num">42%</b></span><span>36pt</span></div>
    </section>

    <div class="sect"><h2>기본</h2><span class="meta">무료 3종</span></div>
    <div class="grid" role="radiogroup" aria-label="기본 캐릭터">
      <div class="cell selected" role="radio" aria-checked="true" aria-label="햄스터, 사용 중">
        <div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="check"><i data-icon="check" data-size="14" data-w="2.6" style="color:#000"></i></span></div>
        <div class="name">햄스터</div><div class="st">사용 중</div>
      </div>
      <div class="cell" role="radio" aria-checked="false" aria-label="펭귄">
        <div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div></div>
        <div class="name">펭귄</div><div class="st">무료</div>
      </div>
      <div class="cell" role="radio" aria-checked="false" aria-label="로켓">
        <div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div></div>
        <div class="name">로켓</div><div class="st">무료</div>
      </div>
    </div>

    <div class="sect"><h2>동물 팩</h2><a href="#" aria-label="동물 팩 6종, 1,100원, 자세히"><span class="price num">1,100원</span><i data-icon="chev" data-size="16"></i></a></div>
    <div class="grid">
      <div class="cell locked previewing" aria-label="강아지, 잠김, 미리보는 중">
        <div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="lockb"><i data-icon="lock" data-size="12" data-w="2" style="color:#D6D2CA"></i></span></div>
        <div class="name">강아지</div><div class="st"><span class="eq"><i style="height:5px"></i><i style="height:9px"></i><i style="height:6px"></i></span>미리보는 중</div>
      </div>
      <div class="cell locked" aria-label="토끼, 잠김">
        <div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="lockb"><i data-icon="lock" data-size="12" data-w="2" style="color:#D6D2CA"></i></span></div>
        <div class="name">토끼</div><div class="st">팩에 포함</div>
      </div>
      <div class="cell locked" aria-label="거북이, 잠김">
        <div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="lockb"><i data-icon="lock" data-size="12" data-w="2" style="color:#D6D2CA"></i></span></div>
        <div class="name">거북이</div><div class="st">팩에 포함</div>
      </div>
      <div class="cell locked"><div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="lockb"><i data-icon="lock" data-size="12" data-w="2" style="color:#D6D2CA"></i></span></div><div class="name">오리</div><div class="st">팩에 포함</div></div>
      <div class="cell locked"><div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="lockb"><i data-icon="lock" data-size="12" data-w="2" style="color:#D6D2CA"></i></span></div><div class="name">다람쥐</div><div class="st">팩에 포함</div></div>
      <div class="cell locked"><div class="tile"><div class="ph sm"><div class="glyph"><i></i></div></div><span class="lockb"><i data-icon="lock" data-size="12" data-w="2" style="color:#D6D2CA"></i></span></div><div class="name">판다</div><div class="st">팩에 포함</div></div>
    </div>
  </div>

  <nav class="tabbar" aria-label="탭">
    <a href="#"><i data-icon="gauge" data-size="24"></i>러너</a>
    <a class="on" href="#"><i data-icon="grid" data-size="24"></i>캐릭터</a>
    <a href="#"><i data-icon="gear" data-size="24"></i>설정</a>
  </nav>
  <div class="homeind"></div>
</div>
<script src="mock.js"></script>
</body>
</html>
