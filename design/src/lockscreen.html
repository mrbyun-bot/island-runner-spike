<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잠금 화면 Live Activity</title>
<link rel="stylesheet" href="app.css">
<style>
  .wall { position: absolute; inset: 0; background: #2F3A41; }
  .lockclock { position: absolute; left: 0; right: 0; top: 70px; text-align: center; color: #F4F1EA; }
  .lockclock .d { font: 600 20px/24px var(--font); }
  .lockclock .t { font: 700 96px/100px var(--font); letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .la { position: absolute; left: 11px; width: 380px; bottom: 132px; border-radius: 24px; background: #000; padding: 14px; display: flex; gap: 14px; color: #F4F1EA; }
  .la .ph { width: 80px; height: 80px; }
  .la .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .la .top { display: flex; justify-content: space-between; font: var(--t-cap); color: #A39F97; }
  .la .mid { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .la .big { font: 600 34px/38px var(--font); color: #30D158; font-variant-numeric: tabular-nums; }
  .la .tier { font: var(--t-sub-strong); }
  .la .tier span { color: #A39F97; font-weight: 400; }
  .la .tiers { display: grid; grid-template-columns: 10fr 40fr 30fr 20fr; gap: 2px; height: 4px; margin-top: 8px; }
  .la .tiers i { background: #2A2A2A; display: block; }
  .la .tiers i.on { background: #30D158; }
  .la .facts { display: flex; gap: 14px; margin-top: 8px; font: var(--t-foot); color: #A39F97; font-variant-numeric: tabular-nums; }
  .la .facts b { color: #F4F1EA; font-weight: 600; }
  .qb { position: absolute; bottom: 44px; width: 50px; height: 50px; border-radius: 25px; background: rgba(0,0,0,.35); }
  .note { position: absolute; left: 16px; right: 16px; bottom: 290px; font: var(--t-foot); color: #DAD6CE; display: none; }
</style>
</head>
<body>
<div class="screen">
  <div class="wall"></div>
  <div class="status">
    <div class="island idle"></div>
    <div class="sys" style="color:#F4F1EA"><i data-icon="signal" data-size="18"></i><i data-icon="wifi" data-size="18"></i><i data-icon="battery" data-size="26" data-w="1.4"></i></div>
  </div>
  <div class="lockclock"><div class="d">11월 29일 토요일</div><div class="t">9:41</div></div>

  <section class="la" aria-label="러너, 배터리 기준, 78퍼센트, 빠름">
    <div class="ph" role="img" aria-label="햄스터"><div class="glyph"><i></i></div><div class="tag">80pt</div></div>
    <div class="col">
      <div class="top"><span>러너 · 배터리 기준</span><span class="num">9:38 갱신</span></div>
      <div class="mid"><span class="big">78%</span><span class="tier">빠름 <span>· 0.5초</span></span></div>
      <div class="tiers" aria-hidden="true"><i></i><i></i><i class="on"></i><i></i></div>
      <div class="facts"><span>CPU <b>42%</b> 9:38</span><span>메모리 <b>64%</b></span></div>
    </div>
  </section>

  <span class="qb" style="left:46px"></span><span class="qb" style="right:46px"></span>
  <div class="homeind" style="background:#F4F1EA"></div>
</div>
<script src="mock.js"></script>
</body>
</html>
